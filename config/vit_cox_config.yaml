# Config for the ViT-Cox hybrid model (src/ViT_cox/), reproducing the
# architecture in Fig. 4 (p.15) of 2604.21056v1.pdf, adapted per project
# instructions: image branch = DINOv3 CLS token (reuses the cache already
# built for src/linear_model/), radiomics branch = shallow (1-block)
# transformer pretrained on LUNA16.

data:
  splits_dir: data/splits
  train_split: stratified_train.csv
  valid_split: stratified_valid.csv
  test_split: stratified_test.csv
  event_type: event
  event_time_columns:
    event: time_months
    recurrence: recurrence_t_months
    metastasis: metastasis_t_months
    survival_status: death_t_months

image:
  # Reuses the cache already built for the linear-head study -- same
  # DINOv3 CLS tokens, no need to recompute.
  cache_file: output/cache/image_features_dinov3_vits16plus.npz
  embed_dim: 384

radiomics:
  tokens_cache: ViT_output/cache/npc_radiomics_tokens.npz
  pretrained_checkpoint: ViT_output/checkpoints/radiomics_transformer_pretrained.pt
  embed_dim: 128
  n_patches: 36

model:
  alpha: 0.5 # mixed-risk weighting between image/radiomics risk (eq. 3)
  lambda_loss: 0.5 # Cox vs. contrastive loss weighting (paper's default)
  temperature: 0.5 # NT-Xent temperature (paper's default)

training:
  seed: 42
  epochs: 200
  patience: 20
  lr: 0.0001
  weight_decay: 0.01
  device: cpu

output:
  dir: ViT_output
  checkpoint_file: hybrid_model_{event_type}.pt
  metrics_file: metrics_{event_type}.json
  plots_dir: plots
